services:
  db:
    image: mysql:8.0
    container_name: notes-db
    environment:
      MYSQL_DATABASE: notepad
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - notes_mysql_data:/var/lib/mysql
    restart: unless-stopped
    # No ports exposed to host (private only)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notes-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/notepad
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # Optional: keep your jwt.* as env later if you want
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:8080"   # host:container (used by Cloudflare Tunnel)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://notes-api.noahwie.ch"
    container_name: notes-frontend
    restart: unless-stopped
    ports:
      - "3000:80"     # host:container (used by Cloudflare Tunnel)

volumes:
  notes_mysql_data:
